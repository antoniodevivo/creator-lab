allowBuilds:
  onnxruntime-node: false
  # Only "chmod u+x" on the bundled Linux binaries.
  "@ffmpeg-installer/linux-x64": true
  "@ffprobe-installer/linux-x64": true
# Install platform binaries (FFmpeg) for this OS and for Linux x64, so one node_modules folder works
# from Windows and from WSL2.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64]
